name: Site CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Site checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os, re
          if not re.match(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+', os.environ['PR_TITLE']):
              raise SystemExit('Use a Conventional Commit title, e.g. feat: add activity page')
          PY
      - name: Check publication scope and local references
        run: python3 scripts/site/package.py check
      - name: Test packaging and deployment failure paths
        run: python3 -m unittest discover -s scripts/site/tests -v
      - name: Test existing certificate synchronization
        run: python3 -m unittest discover -s ops/cdn-cert-sync -p 'test_*.py' -v
      - name: Test OPC certificate renewal and isolated deployment
        run: python3 -m unittest discover -s ops/opc-cert-sync -p 'test_*.py' -v
      - name: Build preview bundle
        run: |
          python3 scripts/site/package.py build --version v0.0.0 --revision "$(git rev-parse HEAD)"
      - name: Record verified preview checksums
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('dist/release/manifest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"Verified preview: {len(manifest['files'])} files; commit `{manifest['revision']}`.\n\n")
              out.write('```text\n' + Path('dist/release/SHA256SUMS').read_text() + '```\n')
          PYCODE
      - name: Probe public COS origin from GitHub runner
        run: |
          curl --fail --silent --show-error --head --connect-timeout 15 --max-time 45 \
            https://qintopia-1305166808.cos.ap-chengdu.myqcloud.com/index.html
