name: FDE site CI

on:
  pull_request:
    paths:
      - "sites/fde/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/fde-ci.yml"
  push:
    branches: [main]
    paths:
      - "sites/fde/**"
      - "package.json"
      - "package-lock.json"
      - ".npmrc"
      - ".github/workflows/fde-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fde-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: FDE builds and content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run check:fde
