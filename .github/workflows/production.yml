name: Website production
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy published release, roll back to successful release, or test cloud access
        required: true
        type: choice
        options: [probe, deploy, rollback]
        default: probe
      tag:
        description: Published stable release tag (not needed for probe)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: qintopia-website-production
  cancel-in-progress: false
jobs:
  production:
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      OPERATION: ${{ github.event_name == 'release' && 'deploy' || inputs.operation }}
    steps:
      - name: Check out trusted tools from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate infrastructure configuration
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          CDN_SECRET_ID: ${{ secrets.CDN_SECRET_ID }}
          CDN_SECRET_KEY: ${{ secrets.CDN_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import os
          missing = [k for k in ('COS_SECRET_ID', 'COS_SECRET_KEY', 'CDN_SECRET_ID', 'CDN_SECRET_KEY') if not os.environ.get(k)]
          if missing:
              raise SystemExit('Missing production environment secrets: ' + ', '.join(missing))
          PY
      - name: Test trusted release tools
        run: python3 -m unittest discover -s scripts/site/tests -v
      - name: Install pinned cloud clients
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/site/requirements.lock
      - name: Resolve published release and immutable artifact
        if: env.OPERATION != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site/github_release.py prepare --tag "$RELEASE_TAG" --operation "$OPERATION"
      - name: Upload, refresh and verify (or connectivity probe)
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          CDN_SECRET_ID: ${{ secrets.CDN_SECRET_ID }}
          CDN_SECRET_KEY: ${{ secrets.CDN_SECRET_KEY }}
          CDN_SESSION_TOKEN: ${{ secrets.CDN_SESSION_TOKEN }}
        run: python3 scripts/site/cloud.py "$OPERATION"
      - name: Record successful version only after live verification
        if: env.OPERATION != 'probe'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site/github_release.py record --tag "$RELEASE_TAG"
      - name: Preserve verification evidence in run summary
        if: always() && env.OPERATION != 'probe'
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              for name in ('SHA256SUMS', 'verified-deployment.json'):
                  path = Path('dist/release') / name
                  if path.exists():
                      out.write(f"\n{name}\n\n```text\n{path.read_text()}```\n")
          PYCODE
